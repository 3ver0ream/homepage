<!doctype html>
<html lang="{% if page.lang == 'zh' %}zh-CN{% else %}en{% endif %}">
  <head>
    {% include head.html %}
  </head>
  <body>
    <a class="skip-link" href="#main-content">{% if page.lang == 'zh' %}跳到正文{% else %}Skip to content{% endif %}</a>
    {% include header.html %}
    <main id="main-content" class="site-main container" tabindex="-1">
      {{ content }}
    </main>
    {% include footer.html %}
    <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
  </body>
</html>
