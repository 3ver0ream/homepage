title: "3ver0ream"
description: "Personal homepage"
url: "https://3ver0ream.github.io"
baseurl: "/homepage"
timezone: Asia/Shanghai

markdown: kramdown
highlighter: rouge
theme: null
plugins: []
permalink: /:title/

kramdown:
  input: GFM
  math_engine: null
  syntax_highlighter: rouge

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      nav_key: blog
      original: true
      math: false
      toc: true

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules
  - work

